<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <div class="display-4 text-center mt-5 mb-5">
        Login with Bootstrap CSS
    </div>
    <div class="d-flex justify-content-center">
        <div class="text-center w-25">
            <p class="display-6">Bienvenido</p>
            <form id="myloginform">
                <div class="mt-3 mb-3">
                    <div>
                        <label for="usuario">Usuario: </label>
                        <input class="form-control" type="text" name="usuario" id="usuario">
                    </div>
                    <div>
                        <label for="password">Contrase&ntilde;a:</label>
                        <input class="form-control" type="password" name="password" id="password">
                    </div>
                </div>
                <div>
                    <input class="form-check-input" type="checkbox" name="mantsesion" id="mantsesion">
                    <label class="form-check-label" for="mantsesion">Mantener sesi&oacute;n iniciada</label>
                </div>
                <div class="mt-3">
                    <button class="btn btn-primary" type="submit">Iniciar sesi&oacute;n</button>
                </div>
            </form>
            <div class="mt-3">
                <a">Recuperar contrase&ntilde;a</a>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./../js/01-bootstrap.js"></script>
</body>
</html>
