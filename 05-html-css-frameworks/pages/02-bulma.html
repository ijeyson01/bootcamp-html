<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0/css/all.min.css"> 
    <title>Login with Bulma CSS</title>
</head>
<body>
    <div>
        <div class="is-size-2 has-text-centered mt-5 mb-5">
            Login with Bulma CSS
        </div>
        <div>
            <div class="has-text-centered is-size-3">
                Bienvenido
            </div>
            <div class="columns is-mobile is-centered mt-3 mb-3">
                <div class="has-text-centered column is-one-quarter">
                    <div class="mt-3 mb-3">
                        <label class="label" for="usuario">Usuario:</label>
                        <div class="control has-icons-left">
                            <input class="input" type="text" name="usuario" id="usuario">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                              </span>
                        </div>
                    </div>
                    <div class="mt-3 mb-3">
                        <label class="label" for="password">Contrase&ntilde;a:</label>
                        <div class="control has-icons-left">
                            <input class="input" type="password" name="password" id="password">
                            <span class="icon is-small is-left">
                                <i class="fas fa-lock"></i>
                              </span>
                        </div>
                    </div>
                    <div class="mt-3 mb-3">
                        <input class="checkbox" type="checkbox" name="cbxmantenersesion" id="cbxmantenersesion">
                        <label for="cbxmantenersesion">Mantener sesi&oacute;n iniciada</label>
                    </div>
                    <div class="mt-3 mb-3">
                        <input class="button is-primary" type="button" value="Iniciar sesi&oacute;n">
                    </div>
                    <div class="mt-5">
                        <a href="http://"> Recuperar contrase&ntilde;a </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
